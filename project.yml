name: Bloom
options:
  bundleIdPrefix: com.yencarnacion
  deploymentTarget:
    iOS: "17.0"
packages:
  HabitCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: C82QQM36G7
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Bloom:
    type: application
    productName: ios-tracker
    platform: iOS
    sources:
      - path: HabitTracker
        excludes: [Core]
    dependencies:
      - package: HabitCore
    settings:
      base:
        PRODUCT_NAME: ios-tracker
        PRODUCT_BUNDLE_IDENTIFIER: com.yencarnacion.bloomhabits
        INFOPLIST_FILE: HabitTracker/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "3"
        SWIFT_EMIT_LOC_STRINGS: YES
  BloomUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/BloomUITests]
    dependencies:
      - target: Bloom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yencarnacion.bloomhabits.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Bloom:
    build:
      targets:
        Bloom: all
    test:
      targets: [BloomUITests]

